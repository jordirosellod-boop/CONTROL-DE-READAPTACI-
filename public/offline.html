<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2ea0" />
    <title>Sense connexió · Readaptació</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; text-align: center; padding: 24px;
        font-family: system-ui, -apple-system, sans-serif; color: #fff; background: #0a2ea0;
        background-image: repeating-linear-gradient(135deg, rgb(255 255 255 / 0.07) 0 18px, transparent 18px 44px);
      }
      img { width: 96px; height: 96px; }
      h1 { margin: 16px 0 4px; font-size: 28px; letter-spacing: 0.02em; text-transform: uppercase; }
      p { margin: 0 auto; max-width: 300px; opacity: 0.85; line-height: 1.5; }
      button { margin-top: 24px; padding: 12px 28px; border-radius: 999px; border: 2px solid #fff; background: transparent; color: #fff; font-weight: 700; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <img src="/escut.png" alt="Escut CE Europa" />
      <h1>Sense connexió</h1>
      <p>Aquesta pàgina encara no s'havia obert amb cobertura. Les pàgines que ja has visitat es poden tornar a obrir sense connexió.</p>
      <button onclick="location.reload()">Tornar-ho a provar</button>
    </main>
  </body>
</html>
